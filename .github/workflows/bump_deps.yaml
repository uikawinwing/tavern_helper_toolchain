name: bump_deps

on:
  schedule:
    - cron: 0 0 */3 * *
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  bump_deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Update dependencies
        run: |
          pnpm update
          pnpm install --lockfile-only

      - name: Refresh TavernHelper types
        run: |
          rm -rf @types
          mkdir -p @types
          wget https://gitlab.com/novi028/JS-Slash-Runner/-/raw/main/dist/@types.zip -O @types.zip
          tar -xf @types.zip -C @types
          rm -f @types.zip

      - name: Refresh tavern_sync
        run: |
          rm -f tavern_sync.mjs
          wget https://raw.githubusercontent.com/StageDog/tavern_sync/refs/heads/main/dist/tavern_sync.mjs

      - name: Verify updated Toolchain before commit
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit verified dependency update
        uses: EndBug/add-and-commit@v10
        with:
          default_author: github_actions
          message: '[bot] Bump shared Toolchain deps'
