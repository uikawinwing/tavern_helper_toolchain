name: consumer_bundle

on:
  workflow_call:

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: TavernDev/Scripts/project
      TOOLCHAIN_DIR: TavernDev/Toolchain

    steps:
      - name: Checkout consumer project
        uses: actions/checkout@v4
        with:
          path: ${{ env.PROJECT_DIR }}

      - name: Checkout shared TavernHelper Toolchain
        uses: actions/checkout@v4
        with:
          repository: uikawinwing/tavern_helper_toolchain
          ref: main
          path: ${{ env.TOOLCHAIN_DIR }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install shared Toolchain dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.TOOLCHAIN_DIR }}

      - name: Typecheck consumer
        run: npm run typecheck
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Rebuild consumer
        run: |
          rm -rf dist
          npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Commit bundled output
        id: bundle_commit
        uses: EndBug/add-and-commit@v10
        with:
          cwd: ${{ env.PROJECT_DIR }}
          add: dist
          default_author: github_actions
          message: '[bot] bundle'

      - id: autotag
        if: github.event_name != 'schedule' || steps.bundle_commit.outputs.committed == 'true'
        uses: phish108/autotag-action@v1.1.64
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
          release-branch: master,main
          with-v: true

      - name: Remove previous moving tag
        if: ${{ (github.event_name != 'schedule' || steps.bundle_commit.outputs.committed == 'true') && steps.autotag.outputs.tag != '0.0.0' && steps.autotag.outputs.new-tag != steps.autotag.outputs.tag }}
        run: git push --delete origin ${{ steps.autotag.outputs.tag }}
        working-directory: ${{ env.PROJECT_DIR }}
